server {
    server_name tdctech.org www.tdctech.org;

    # Same application as tdc-tech.novaspack.com — domain change only, no code change.
    root /var/www/tdc-tech.novaspack.com/public;
    index index.php;

    charset utf-8;
    server_tokens off;
    client_max_body_size 220m;

    access_log /var/log/nginx/tdctech.org.access.log;
    error_log  /var/log/nginx/tdctech.org.error.log;

    # Let Certbot complete the HTTP-01 challenge before HTTPS exists.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; allow all; }

    location ~ /\.(?!well-known) { return 404; }
    location ~* \.php\..*$ { return 404; }
    location ~* ([._-]bak|\.broken$|\.(log|sql|md|ini|example|backup|old|orig|save|swp|swo|json|lock)$) { return 404; }
    # Always revalidate the music module so UI updates reach clients immediately
location ~* ^/assets/music-studio\.(js|css)$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}

    # TDC clean page URLs; API endpoints retain their existing contracts.
    if ($request_uri ~ "^/(login|register|dashboard|verify|payment-return|admin/login|admin/providers|admin/service|admin/content|admin/emails|admin/tickets|services/[a-z-]+)\.php(?:\?|$)") { return 308 /$1$is_args$args; }
    if ($request_uri ~ "^/index\.php(?:\?|$)") { return 308 /$is_args$args; }
    if ($request_uri ~ "^/admin/index\.php(?:\?|$)") { return 308 /admin/$is_args$args; }
    location = /login { rewrite ^ /login.php last; }
    location = /register { rewrite ^ /register.php last; }
    location = /dashboard { rewrite ^ /dashboard.php last; }
    location = /profile { rewrite ^ /dashboard.php last; }
    location = /cart { rewrite ^ /dashboard.php last; }
    location = /support { rewrite ^ /dashboard.php last; }
    location = /verify { rewrite ^ /verify.php last; }
    location = /payment-return { rewrite ^ /payment-return.php last; }
    location = /admin/login { rewrite ^ /admin/login.php last; }
    location = /admin/providers { rewrite ^ /admin/providers.php last; }
    location = /admin/service { rewrite ^ /admin/service.php last; }
    location = /admin/content { rewrite ^ /admin/content.php last; }
    location = /admin/emails { rewrite ^ /admin/emails.php last; }
    location = /admin/tickets { rewrite ^ /admin/tickets.php last; }
    location = /services/social-ads { rewrite ^ /services/social-ads.php last; }
    location = /music { rewrite ^ /services/music.php last; }
    location = /services/music { rewrite ^ /services/music.php last; }
    location = /services/verification { rewrite ^ /services/verification.php last; }
    location = /services/web-dev { rewrite ^ /services/web-dev.php last; }
    location = /services/account-mgmt { rewrite ^ /services/account-mgmt.php last; }
    location = /services/press { rewrite ^ /services/press.php last; }
    location = /services/smm { rewrite ^ /services/smm.php last; }
    location = /services/numbers { rewrite ^ /services/numbers.php last; }
    location = /services/bots { rewrite ^ /services/bots.php last; }
    location = /services/proxies { rewrite ^ /services/proxies.php last; }
    location ^~ /wantam/ { try_files $uri =404; }

    location = /news { rewrite ^ /news.php last; }
    location = /admin/news { rewrite ^ /admin/news.php last; }
    location = /admin/templates { rewrite ^ /admin/templates.php last; }
    location = /dashboard/services/social-media-ads { rewrite ^ /services/social-ads.php last; }
    location = /dashboard/services/verification { rewrite ^ /services/verification.php last; }
    location = /dashboard/services/press-releases { rewrite ^ /services/press.php last; }
    location = /dashboard/services/web-app-dev { rewrite ^ /services/web-dev.php last; }
    location = /dashboard/services/music { rewrite ^ /services/music.php last; }
    location = /dashboard/services/account-management { rewrite ^ /services/account-mgmt.php last; }
    location = /dashboard/services/custom-bots { rewrite ^ /services/bots.php last; }
    location = /services/account-management { rewrite ^ /services/account-mgmt.php last; }
    location = /services/custom-bots { rewrite ^ /services/bots.php last; }
    location / { try_files $uri $uri/ =404; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors off;
        fastcgi_read_timeout 300;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    # certificate/key/dhparam paths intentionally omitted; managed by Certbot on the host.
    # certificate/key/dhparam paths intentionally omitted; managed by Certbot on the host.
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    # certificate/key/dhparam paths intentionally omitted; managed by Certbot on the host.


}
server {
    if ($host = www.tdctech.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = tdctech.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name tdctech.org www.tdctech.org;
    return 404; # managed by Certbot




}
